spring.application.name=order-service
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (optional, helpful while learning)
logging.level.org.hibernate.SQL=debug

eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka

management.tracing.sampling.probability=1.0
spring.zipkin.base-url=http://localhost:9411

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.default-topic=notificationTopic
spring.kafka.producer.properties.spring.json.type.mapping=event:com.oros.orderservice.event.OrderPlacedEvent
management.endpoints.web.exposure.include=health,info,metrics,loggers,httptrace
management.endpoint.health.show-details=always

#resilience4j properties
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.ignoreExceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

#resilience4j timeout properties
resilience4j.timelimiter.instances.orderServiceTimeLimiter.timeoutDuration=3s

#resilience4j retry properties
resilience4j.retry.instances.orderServiceRetry.maxAttempts=3
resilience4j.retry.instances.orderServiceRetry.waitDuration=2s
resilience4j.retry.instances.orderServiceRetry.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.orderServiceRetry.ignoreExceptions=org.springframework.web.client.HttpClientErrorException
